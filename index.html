<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>오렌지 심장 건강 실습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>

/* Layout: app shell — a header with four tabs; the practice tab is an Orange-style workbench (widget palette | canvas | mission list) */
:root{
  --bg:#e8ecee; --panel:#ffffff; --panel2:#f3f5f6; --ink:#1c2326; --muted:#5a666c; --line:#d2d9dd;
  --canvas:#f9fafa; --grid:#d6dde0; --link:#8e9da4;
  --accent:#e8740f; --accent-soft:#fde4cc; --accent-ink:#7a3800; --sel:#2c6fcb; --sel-soft:#dbe7f8;
  --cat-data:#fbc794; --cat-vis:#f6a9a1; --cat-model:#efb4d7; --cat-eval:#a3dcd3; --node-ink:#3a2a20; --node-ring:#ffffff;
  --c0:#3b9edb; --c1:#e04e39; --c2:#7cbc35; --c3:#e3a114; --c4:#8c69cf; --c5:#6b7780;
  --ok:#23905a; --ok-soft:#d8f0e3; --warn:#b57d00; --warn-soft:#fbefcf; --err:#c93c2c; --err-soft:#f9dcd8;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 14px 40px rgba(18,28,33,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181a; --panel:#1c2225; --panel2:#232a2e; --ink:#e5eaec; --muted:#97a3a9; --line:#323b40;
  --canvas:#181d20; --grid:#2b3337; --link:#6f7f87;
  --accent:#f5953e; --accent-soft:#3d2a18; --accent-ink:#ffc999; --sel:#6aa3f0; --sel-soft:#1f3350;
  --cat-data:#f0b277; --cat-vis:#ec9890; --cat-model:#e3a2ca; --cat-eval:#8ccdc3; --node-ink:#2c1e15; --node-ring:#2a3236;
  --c0:#4fb0ea; --c1:#f0624d; --c2:#8fd048; --c3:#f0b232; --c4:#a184e0; --c5:#8d989f;
  --ok:#4cc184; --ok-soft:#173527; --warn:#e7b443; --warn-soft:#3a3016; --err:#f07463; --err-soft:#3d1f1b;
  --shadow:0 14px 40px rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13181a; --panel:#1c2225; --panel2:#232a2e; --ink:#e5eaec; --muted:#97a3a9; --line:#323b40;
  --canvas:#181d20; --grid:#2b3337; --link:#6f7f87;
  --accent:#f5953e; --accent-soft:#3d2a18; --accent-ink:#ffc999; --sel:#6aa3f0; --sel-soft:#1f3350;
  --cat-data:#f0b277; --cat-vis:#ec9890; --cat-model:#e3a2ca; --cat-eval:#8ccdc3; --node-ink:#2c1e15; --node-ring:#2a3236;
  --c0:#4fb0ea; --c1:#f0624d; --c2:#8fd048; --c3:#f0b232; --c4:#a184e0; --c5:#8d989f;
  --ok:#4cc184; --ok-soft:#173527; --warn:#e7b443; --warn-soft:#3a3016; --err:#f07463; --err-soft:#3d1f1b;
  --shadow:0 14px 40px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:12px;min-width:0}
.brand .mark{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;margin:0;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 11px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding-block:16px 40px}

/* practice workbench */
.bench{display:grid;grid-template-columns:184px minmax(0,1fr) 320px;gap:14px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.palette{padding:10px}
.palette h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px 6px;font-weight:600}
.palette h3:first-child{margin-top:2px}
.pitem{display:flex;align-items:center;gap:9px;width:100%;background:none;border:1px solid transparent;border-radius:8px;padding:5px 6px;text-align:left;font-size:13px}
.pitem:hover{background:var(--panel2);border-color:var(--line)}
.pdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--node-ink);flex:none}
.cat-data{background:var(--cat-data)} .cat-vis{background:var(--cat-vis)} .cat-model{background:var(--cat-model)} .cat-eval{background:var(--cat-eval)}
.palette .tip{font-size:12px;color:var(--muted);margin:12px 4px 2px;line-height:1.5}

.canvas-pane{overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tbtn:hover:not(:disabled){border-color:var(--muted)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.arm{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar .sp{flex:1}
.toolbar input{border:1px solid var(--sel);border-radius:6px;padding:4px 8px;width:150px;background:var(--panel)}
#canvas{display:block;width:100%;height:auto;background:var(--canvas);touch-action:none;user-select:none;-webkit-user-select:none}
.hint-bar{font-size:12px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.hint-bar b{color:var(--ink);font-weight:600}

svg .gridpt{fill:var(--grid)}
.node .body{stroke:var(--node-ring);stroke-width:3}
.node.sel .body{stroke:var(--sel);stroke-width:3.5}
.node .arc{fill:none;stroke:var(--link);stroke-width:4;stroke-linecap:round}
.node .arc.free{stroke-dasharray:2 5;stroke-width:3}
.node .nlabel{fill:var(--ink);font-size:13px;font-family:var(--f-body);text-anchor:middle}
.node .nbadge{fill:var(--muted);font-size:11px;font-family:var(--f-mono);text-anchor:middle}
.node .ico{color:var(--node-ink)}
.node{cursor:grab}
.port{fill:transparent;cursor:crosshair}
.port:hover{fill:var(--sel-soft);fill-opacity:.6}
.lnk{fill:none;stroke:var(--link);stroke-width:2.4}
.lnk.sel{stroke:var(--sel);stroke-width:3.2}
.lnk-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.lnk-label{fill:var(--muted);font-size:11px;font-family:var(--f-body);text-anchor:middle;paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}
.tmp-lnk{fill:none;stroke:var(--sel);stroke-width:2.4;stroke-dasharray:6 4}
.stat-dot.err{fill:var(--err)} .stat-dot.warn{fill:var(--warn)}
.stat-mark{fill:#fff;font-size:10px;font-weight:700;text-anchor:middle;font-family:var(--f-body)}
.empty-msg{fill:var(--muted);font-size:15px;text-anchor:middle;font-family:var(--f-body)}

/* missions */
.missions{padding:14px 14px 10px}
.missions h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 2px}
.missions .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prog-txt{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:6px 0 10px;display:flex;justify-content:space-between}
.mstage{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 4px}
.mi{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 6px;border-radius:8px;align-items:start}
.mi .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);font-family:var(--f-mono);margin-top:1px}
.mi.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.mi.done .mt{color:var(--muted)}
.mi.cur{background:var(--accent-soft)}
.mi.cur .ck{border-color:var(--accent);color:var(--accent-ink)}
.mt{font-weight:600;font-size:13.2px;line-height:1.4}
.md{font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.55}
.md .pg{font-family:var(--f-mono);font-size:11px;color:var(--accent-ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.md code,.kbd{font-family:var(--f-mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.all-done{background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px}

/* dialog windows */
.ovl{position:fixed;inset:0;background:rgba(10,16,20,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.win.sm{width:min(440px,100%)} .win.md{width:min(720px,100%)}
.wtitle{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:13px}
.wtitle .t{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wclose{border:0;background:none;width:30px;height:30px;border-radius:6px;font-size:20px;line-height:1;color:var(--muted)}
.wclose:hover{background:var(--err-soft);color:var(--err)}
.wbody{padding:14px;overflow:auto;min-height:0;flex:1}
.wstatus{border-top:1px solid var(--line);padding:6px 14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--panel2);display:flex;gap:14px;flex-wrap:wrap}
.wcols{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.box>legend,.box .lg{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}
fieldset.box{margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
.row label{font-size:13px}
.row select,.row input[type=number],.row input[type=text]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel);min-width:0}
.row select{max-width:100%}
.row .grow{flex:1}
.lbl-w{width:120px;flex:none}
.info{font-size:12.5px;line-height:1.6;font-family:var(--f-mono)}
.note{font-size:12.5px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:9px 11px;margin-top:10px;line-height:1.55}
.note b{color:var(--accent-ink)}
.msg{border-radius:8px;padding:8px 11px;font-size:13px;margin-bottom:10px}
.msg.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.msg.err{background:var(--err-soft);border:1px solid var(--err)}
.msg.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 12px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.blue{border-color:var(--sel);color:var(--sel);background:var(--sel-soft)}
.scroll{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:6px}
table.dt{border-collapse:collapse;font-size:12.5px;width:100%;font-variant-numeric:tabular-nums}
.dt th{position:sticky;top:0;background:var(--panel2);font-weight:600;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.dt td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td.num{text-align:right;font-family:var(--f-mono);font-size:12px}
.dt th.num{text-align:right}
.dt td.idx,.dt th.idx{color:var(--muted);text-align:right;font-family:var(--f-mono);font-size:11px}
.dt .tgt{background:var(--sel-soft)}
.dt .miss{color:var(--err);font-weight:700}
.dt tr.bad td{background:var(--err-soft)}
.tb{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;font-size:10.5px;font-weight:700;color:#fff;font-family:var(--f-mono);margin-right:6px;vertical-align:-3px}
.tb.N{background:#c0392b} .tb.C{background:#2b8a4b}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.listbox{border:1px solid var(--line);border-radius:6px;min-height:80px;max-height:200px;overflow:auto;padding:3px;background:var(--panel)}
.li{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:4px;font-size:13px}
.li:hover{background:var(--panel2)}
.li.on{background:var(--sel);color:#fff}
.li.on .tb{outline:1px solid #fff}
.sc-grid{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:8px;align-items:center}
.sc-mid{display:flex;flex-direction:column;gap:6px}
.sc-mid .btn{padding:4px 0}
.sc-right{display:flex;flex-direction:column;gap:8px}
.sc-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.pp-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
.pp-list .li{display:flex;gap:6px;align-items:center}
.pp-list .li:disabled{opacity:.42;cursor:not-allowed}
.pp-box{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.pp-box h4{margin:0;padding:6px 10px;background:var(--panel2);font-size:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.pp-box h4 button{border:0;background:none;font-size:16px;color:var(--muted);line-height:1}
.pp-box .opts{padding:6px 12px}
.pp-box label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.radio-l{display:flex;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.sub-opts{padding-left:24px}
.metric-tbl td,.metric-tbl th{text-align:right}
.metric-tbl td:first-child,.metric-tbl th:first-child{text-align:left}
.cm{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px auto}
.cm td,.cm th{padding:8px 12px;text-align:center;font-size:13.5px;min-width:64px}
.cm th{font-weight:600}
.cm td.cell{border:1px solid var(--line);font-family:var(--f-mono)}
.cm .sum{color:var(--muted);font-weight:600}
.axis-t{font-size:12px;color:var(--muted)}
.vert{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted);font-size:12px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .axis{stroke:var(--line)}
.chart .gl{stroke:var(--grid);stroke-dasharray:2 3}
.chart .title{fill:var(--ink);font-size:12px}
.prob-bar{height:3px;border-radius:2px;margin-top:2px}
.fip-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.fip-list button{display:flex;justify-content:space-between;gap:8px;text-align:left;font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px}
.fip-list button:hover{border-color:var(--sel)}
.choice{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.choice label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--sel);background:var(--sel-soft)}
.files{border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.files .fh{background:var(--panel2);padding:6px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);font-family:var(--f-mono)}
.files button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:8px 10px;text-align:left;font-size:13px}
.files button:last-child{border-bottom:0}
.files button:hover{background:var(--sel-soft)}
.files small{color:var(--muted);margin-left:auto;font-family:var(--f-mono);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* study tab */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.flow .st{padding:12px 12px 14px;border-right:1px solid var(--line);min-width:0;position:relative}
.flow .st:last-child{border-right:0}
.flow .st .n{font-family:var(--f-mono);font-size:11px;color:var(--accent-ink)}
.flow .st h4{margin:2px 0 4px;font-size:14px}
.flow .st p{margin:0 0 8px;font-size:12px;color:var(--muted);line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px 2px 3px;font-size:12px;background:var(--panel)}
button.chip:hover{border-color:var(--sel)}
.chip .d{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--node-ink)}
.study{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.wlist{padding:8px}
.wlist .pitem.on{background:var(--sel-soft);border-color:var(--sel)}
.wdoc{padding:22px 24px}
.wdoc-head{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bigdot{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:var(--node-ink);border:3px solid var(--node-ring);box-shadow:0 0 0 1px var(--line);flex:none}
.wdoc-head h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.wdoc-head .ko{color:var(--muted);font-size:14px}
.io{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.io span{font-size:12px;border-radius:5px;padding:1px 8px;border:1px solid var(--line);background:var(--panel2)}
.io span.in{border-color:var(--c0)} .io span.out{border-color:var(--c2)}
.wdoc .lead{font-size:15.5px;max-width:65ch;margin:0 0 16px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dsec{border-top:2px solid var(--line);padding-top:8px;min-width:0}
.dsec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.dsec ul{margin:0;padding-left:18px}
.dsec li{margin:3px 0;font-size:13.5px}
.dsec.peng{border-top-color:var(--accent)}
.dsec.warn{border-top-color:var(--err)}

    if(c.type==='N'){const s_=Float64Array.from(P.keep.map(r=>r[i]).filter(v=>v!=null)).sort();cuts=[...new Set([.25,.5,.75].map(q=>qmid(s_,q)))];binOf=v=>{let b=0;for(const t of cuts)if(v>t)b++;return b};
      labels=range(cuts.length+1).map(b=>b===0?`≤ ${fx(cuts[0])}`:b===cuts.length?`> ${fx(cuts[b-1])}`:`${fx(cuts[b-1])} ~ ${fx(cuts[b])}`)}
    else{labels=[...c.values];binOf=v=>c.values.indexOf(v)}
    const B=labels.length;const cnt=range(B).map(()=>new Array(K).fill(0));P.keep.forEach((r,j)=>{const v=r[i];if(v==null)return;const b=binOf(v);if(b>=0)cnt[b][P.y[j]]++});
    return{name:c.name,type:c.type,cuts,labels,binOf,cnt}});
  const proba=vals=>{const lp=prior.map(p=>Math.log((p+1)/(P.keep.length+K)));tables.forEach((t,k)=>{const v=vals[k];if(v==null)return;const b=t.binOf(v);if(b<0)return;for(let c=0;c<K;c++)lp[c]+=Math.log((t.cnt[b][c]+1)/(prior[c]+t.labels.length))});const m=Math.max(...lp);const e=lp.map(x=>Math.exp(x-m));const z=e.reduce((a,b)=>a+b,0);return e.map(x=>x/z)};
  return wrapModel(s.name||'Naive Bayes',P,proba,{kind:'nb',prior,tables})}
function fitLR(d,s){const P=prep(d);const E=makeEncoder(P);const X=P.keep.map(r=>E.encode(P.fi.map(i=>r[i])));const K=P.classes.length;const lam=s.reg==='none'?1e-6:1/Math.max(1e-4,s.C);
  const fitBin=yb=>{const p=E.dim+1;let w=new Float64Array(p);for(let it=0;it<60;it++){const g=new Float64Array(p),H=range(p).map(()=>new Float64Array(p));
      for(let n=0;n<X.length;n++){const x=X[n];let z=w[0];for(let j=0;j<E.dim;j++)z+=w[j+1]*x[j];const pr=1/(1+Math.exp(-z));const e=pr-yb[n],wt=pr*(1-pr);
        g[0]+=e;for(let j=0;j<E.dim;j++)g[j+1]+=e*x[j];H[0][0]+=wt;for(let a=0;a<E.dim;a++){const xa=x[a]*wt;if(!xa)continue;H[0][a+1]+=xa;H[a+1][0]+=xa;for(let b=0;b<E.dim;b++)H[a+1][b+1]+=xa*x[b]}}
      for(let j=1;j<p;j++){g[j]+=lam*w[j];H[j][j]+=lam}H[0][0]+=1e-9;const dl=solve(H.map(r=>[...r]),[...g]);let mx=0;for(let j=0;j<p;j++){w[j]-=dl[j];mx=Math.max(mx,Math.abs(dl[j]))}if(mx<1e-8)break}return w};
  const sig=(w,x)=>{let z=w[0];for(let j=0;j<E.dim;j++)z+=w[j+1]*x[j];return 1/(1+Math.exp(-z))};
  const W=K===2?[fitBin(P.y.map(y=>y===1?1:0))]:range(K).map(c=>fitBin(P.y.map(y=>y===c?1:0)));
  const proba=vals=>{const x=E.encode(vals);if(K===2){const p=sig(W[0],x);return[1-p,p]}const ps=W.map(w=>sig(w,x));const z=ps.reduce((a,b)=>a+b,0)||1;return ps.map(v=>v/z)};
  return wrapModel(s.name||'Logistic Regression',P,proba,{kind:'lr'})}
function fitNN(d,s){const P=prep(d);const E=makeEncoder(P);const X=P.keep.map(r=>E.encode(P.fi.map(i=>r[i])));const K=P.classes.length,N=X.length;
  const hid=String(s.hidden).split(/[,\s]+/).map(v=>parseInt(v,10)).filter(v=>v>0).slice(0,3);if(!hid.length)hid.push(100);const sizes=[E.dim,...hid,K];const L=sizes.length-1;
  const r=rng(s.replicable?0:s.seed);const Wt=[],Bs=[];for(let l=0;l<L;l++){const fi=sizes[l],fo=sizes[l+1];const lim=Math.sqrt((s.act==='logistic'?2:6)/(fi+fo))*(s.act==='logistic'?Math.sqrt(3):1);Wt.push(Float64Array.from({length:fi*fo},()=>(r()*2-1)*lim));Bs.push(Float64Array.from({length:fo},()=>(r()*2-1)*lim))}
  const act=s.act,f=act==='relu'?v=>v>0?v:0:act==='tanh'?Math.tanh:act==='logistic'?v=>1/(1+Math.exp(-v)):v=>v;
  const df=act==='relu'?a=>a>0?1:0:act==='tanh'?a=>1-a*a:act==='logistic'?a=>a*(1-a):()=>1;
  const forward=x=>{const A=[x];let cur=x;for(let l=0;l<L;l++){const fi=sizes[l],fo=sizes[l+1],w=Wt[l],b=Bs[l];const z=new Float64Array(fo);for(let o=0;o<fo;o++){let t=b[o];for(let i=0;i<fi;i++)t+=cur[i]*w[i*fo+o];z[o]=t}
      if(l<L-1){for(let o=0;o<fo;o++)z[o]=f(z[o])}else{const m=Math.max(...z);let sm=0;for(let o=0;o<fo;o++){z[o]=Math.exp(z[o]-m);sm+=z[o]}for(let o=0;o<fo;o++)z[o]/=sm}A.push(z);cur=z}return A};
  const mW=Wt.map(w=>new Float64Array(w.length)),vW=Wt.map(w=>new Float64Array(w.length)),mB=Bs.map(b=>new Float64Array(b.length)),vB=Bs.map(b=>new Float64Array(b.length));
  const lr=.001,b1=.9,b2=.999,eps=1e-8,alpha=s.alpha,bs=Math.min(200,N);let t=0,best=Infinity,noImp=0,epochs=0;const idx=range(N);
  for(let ep=0;ep<s.maxIter;ep++){epochs++;shuffle(idx,r);let lossSum=0;
    for(let st=0;st<N;st+=bs){const batch=idx.slice(st,st+bs),m=batch.length;const gW=Wt.map(w=>new Float64Array(w.length)),gB=Bs.map(b=>new Float64Array(b.length));
      for(const n of batch){const A=forward(X[n]);const out=A[L];lossSum-=Math.log(Math.max(out[P.y[n]],1e-10));let delta=Float64Array.from(out);delta[P.y[n]]-=1;
        for(let l=L-1;l>=0;l--){const fi=sizes[l],fo=sizes[l+1],a=A[l],w=Wt[l],gw=gW[l],gb=gB[l];for(let o=0;o<fo;o++){const dl=delta[o];if(!dl)continue;gb[o]+=dl;for(let i=0;i<fi;i++)gw[i*fo+o]+=a[i]*dl}
          if(l>0){const nd=new Float64Array(fi);for(let i=0;i<fi;i++){let sm=0;for(let o=0;o<fo;o++)sm+=w[i*fo+o]*delta[o];nd[i]=sm*df(a[i])}delta=nd}}}
      t++;for(let l=0;l<L;l++){const w=Wt[l],gw=gW[l];for(let q=0;q<w.length;q++){const g=gw[q]/m+alpha*w[q]/m;mW[l][q]=b1*mW[l][q]+(1-b1)*g;vW[l][q]=b2*vW[l][q]+(1-b2)*g*g;w[q]-=lr*(mW[l][q]/(1-b1**t))/(Math.sqrt(vW[l][q]/(1-b2**t))+eps)}
        const b=Bs[l],gb=gB[l];for(let q=0;q<b.length;q++){const g=gb[q]/m;mB[l][q]=b1*mB[l][q]+(1-b1)*g;vB[l][q]=b2*vB[l][q]+(1-b2)*g*g;b[q]-=lr*(mB[l][q]/(1-b1**t))/(Math.sqrt(vB[l][q]/(1-b2**t))+eps)}}}
    const loss=lossSum/N;if(loss>best-1e-4){if(++noImp>=10)break}else noImp=0;if(loss<best)best=loss}
  return wrapModel(s.name||'Neural Network',P,vals=>[...forward(E.encode(vals))[L]],{kind:'nn',epochs})}
function errMsg(e){const m=e.message||String(e);
  if(m==='NO_TARGET')return '타깃(target) 변수가 없어요. File 위젯에서 output의 Role을 target으로 바꿔 주세요.';
  if(m==='NUM_TARGET')return '타깃이 수치형이에요. output의 Type을 categorical로 두세요.';
  if(m==='NO_FEAT')return '특징(feature)이 하나도 없어요.';
  if(m==='NO_ROWS')return '학습할 데이터가 없어요.';
  if(m.startsWith('MISSING_COL:'))return `입력 데이터에 모델이 학습한 열 '${m.slice(12)}'이(가) 없어요.`;
  if(m.startsWith('TYPE:')){const[,c,t]=m.split(':');return `'${c}' 열의 형식이 학습 데이터(${t==='C'?'categorical':'numeric'})와 달라요. 테스트 데이터의 File 위젯에서 ${c}의 Type을 ${t==='C'?'categorical':'numeric'}(으)로 바꿔 주세요.`}
  return '계산 오류: '+m}

/* ---------- metrics ---------- */
function auc(scores,pos){const n=scores.length;const idx=range(n).sort((a,b)=>scores[a]-scores[b]);const rank=new Float64Array(n);
  for(let i=0;i<n;){let j=i;while(j+1<n&&scores[idx[j+1]]===scores[idx[i]])j++;const rk=(i+j)/2+1;for(let t=i;t<=j;t++)rank[idx[t]]=rk;i=j+1}
  let np=0,sr=0;for(let i=0;i<n;i++)if(pos[i]){np++;sr+=rank[i]}const nn=n-np;if(!np||!nn)return NaN;return(sr-np*(np+1)/2)/(np*nn)}
function metrics(classes,actual,probs,target){const K=classes.length,n=actual.length;const pred=probs.map(argmax);
  const cm=Array.from({length:K},()=>new Array(K).fill(0));for(let i=0;i<n;i++)cm[actual[i]][pred[i]]++;
  const per=range(K).map(c=>{const tp=cm[c][c];let fp=0,fn=0;for(let k=0;k<K;k++){if(k!==c){fp+=cm[k][c];fn+=cm[c][k]}}
    const prec=tp+fp?tp/(tp+fp):0,rec=tp+fn?tp/(tp+fn):0,f1=prec+rec?2*prec*rec/(prec+rec):0;const a=auc(probs.map(p=>p[c]),actual.map(x=>x===c));const tn=n-tp-fp-fn;const den=Math.sqrt((tp+fp)*(tp+fn)*(tn+fp)*(tn+fn));
    return{prec,rec,f1,auc:a,sup:tp+fn,mcc:den?(tp*tn-fp*fn)/den:0}});
  const correct=range(K).reduce((s,c)=>s+cm[c][c],0);
  if(target!=null&&target>=0){const p=per[target];return{AUC:p.auc,CA:correct/n,F1:p.f1,Prec:p.prec,Recall:p.rec,MCC:p.mcc,n}}
  const w=c=>per[c].sup/n;let A=0,aw=0;per.forEach((p,c)=>{if(!Number.isNaN(p.auc)){A+=p.auc*w(c);aw+=w(c)}});
  return{AUC:aw?A/aw:NaN,CA:correct/n,F1:per.reduce((s,p,c)=>s+p.f1*w(c),0),Prec:per.reduce((s,p,c)=>s+p.prec*w(c),0),Recall:per.reduce((s,p,c)=>s+p.rec*w(c),0),MCC:per.reduce((s,p,c)=>s+p.mcc*w(c),0),n}}
const MKEYS=['AUC','CA','F1','Prec','Recall','MCC'];
function metricTable(ev,target){return `<table class="dt metric-tbl"><thead><tr><th>Model</th>${MKEYS.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${ev.models.map(m=>{const r=metrics(ev.classes,ev.actual,m.probs,target);return `<tr><td>${esc(m.name)}</td>${MKEYS.map(k=>`<td class="num">${fmt(r[k],3)}</td>`).join('')}</tr>`}).join('')}</tbody></table>`}
function confMat(K,actual,probs){const cm=Array.from({length:K},()=>new Array(K).fill(0));actual.forEach((a,i)=>cm[a][argmax(probs[i])]++);return cm}

testscore:{title:'Test and Score',ko:'평가',cat:'eval',icon:'testscore',ins:[{n:'Data',t:'data'},{n:'Learner',t:'learner',multi:true}],outs:[{n:'Evaluation Results',t:'eval'}],
  defaults:()=>({method:'cv',folds:5,strat:true,reps:10,train:66,rstrat:true,target:'avg',seed:7}),
  compute(n,ins){const d=ins.Data,Ls=(ins.Learner||[]).filter(Boolean);if(!d&&!Ls.length)return{warning:'Data와 Learner 입력이 필요해요.'};if(!d)return{warning:'Data 입력이 필요해요.'};if(!Ls.length)return{warning:'Learner 입력이 필요해요 (모델 위젯을 연결하세요).'};
    const ti=tgtIdx(d);if(ti<0)return{error:errMsg(new Error('NO_TARGET'))};if(d.cols[ti].type!=='C')return{error:errMsg(new Error('NUM_TARGET'))};
    const s=n.settings;const dd=subset(d,range(d.rows.length).filter(i=>d.rows[i][ti]!=null));const N=dd.rows.length;const classes=dd.cols[ti].values;const ys=dd.rows.map(r=>classes.indexOf(r[ti]));
    const r=rng(s.seed);const splits=[];
    if(s.method==='cv'){const k=Math.min(s.folds,N);const f=foldIds(N,ys,k,s.strat,r);for(let q=0;q<k;q++){const tr=[],te=[];for(let i=0;i<N;i++)(f[i]===q?te:tr).push(i);splits.push([tr,te])}}
    else if(s.method==='rs'){for(let q=0;q<s.reps;q++){const f=foldIds(N,ys,100,s.rstrat,r);const cut=Math.round(s.train);const tr=[],te=[];for(let i=0;i<N;i++)(f[i]<cut?tr:te).push(i);splits.push([tr,te])}}
    else if(s.method==='loo'){for(let i=0;i<N;i++)splits.push([range(N).filter(j=>j!==i),[i]])}
    else splits.push([range(N),range(N)]);
    const actual=[];splits.forEach(([,te])=>te.forEach(i=>actual.push(ys[i])));const models=[];
    for(const L of Ls){const probs=[];try{for(const[tr,te]of splits){const M=L.fit(subset(dd,tr));M.predict(subset(dd,te)).forEach(p=>probs.push(p))}}catch(e){return{error:L.name+': '+errMsg(e)}}models.push({name:L.name,kind:L.kind,probs})}
    const ev={classes,actual,models};return{outs:{'Evaluation Results':ev},ev,inN:N,badge:models.length+'개 모델'}},
  dialog(n,r){const s=n.settings;const m=s.method;let res='';if(r.ev){const t=s.target==='avg'?null:r.ev.classes.indexOf(s.target);res=metricTable(r.ev,t)}
    return `${r.error?`<div class="msg err">${r.error}</div>`:r.warning?`<div class="msg warn">${r.warning}</div>`:''}<div class="wcols"><div><fieldset class="box"><legend>Sampling</legend>

/* ---------- charts ---------- */
function miniHist(d,i,ci){const c=d.cols[i];const K=ci>=0?d.cols[ci].values.length:1;let bins,binOf;
  if(c.type==='N'){const vals=d.rows.map(r=>r[i]);const ds=distinctSmall(vals);if(ds){bins=ds.map(()=>new Array(K).fill(0));binOf=v=>ds.indexOf(v)}else{const st=numStats(vals);if(!st)return '';const B=10;bins=range(B).map(()=>new Array(K).fill(0));binOf=v=>Math.min(B-1,Math.floor((v-st.min)/((st.max-st.min)||1)*B))}}
  else{bins=c.values.map(()=>new Array(K).fill(0));binOf=v=>c.values.indexOf(v)}
  const cv=ci>=0?d.cols[ci].values:null;for(const r of d.rows){const v=r[i];if(v==null)continue;const b=binOf(v);if(b<0)continue;const g=cv?cv.indexOf(r[ci]):0;if(g<0)continue;bins[b][g]++}
  const W_=160,H=32,mx=Math.max(1,...bins.map(b=>b.reduce((a,x)=>a+x,0)));const bw=W_/bins.length;
  return `<svg width="${W_}" height="${H}" viewBox="0 0 ${W_} ${H}" style="display:block">${bins.map((b,j)=>{let y=H;return b.map((v,g)=>{const h=v/mx*(H-2);y-=h;return h?`<rect x="${(j*bw+1).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${h.toFixed(1)}" style="fill:${ci>=0?colorOf(g):'var(--c0)'}"/>`:''}).join('')}).join('')}</svg>`}
function distChart(d,vi,si,s){const c=d.cols[vi];const K=si>=0?d.cols[si].values.length:1;let labels,binOf,disc=true;
  if(c.type==='C'){labels=[...c.values];binOf=v=>c.values.indexOf(v)}
  else{const vals=d.rows.map(r=>r[vi]);const ds=distinctSmall(vals);if(ds){labels=ds.map(String);binOf=v=>ds.indexOf(v)}else{disc=false;const st=numStats(vals);const B=s.bins;const w=((st.max-st.min)||1)/B;labels=range(B).map(j=>fmt(+(st.min+j*w).toFixed(2)));binOf=v=>Math.min(B-1,Math.floor((v-st.min)/w))}}
  const bins=labels.map(()=>new Array(K).fill(0));const sv=si>=0?d.cols[si].values:null;
  for(const r of d.rows){const v=r[vi];if(v==null)continue;const b=binOf(v);if(b<0)continue;const g=sv?sv.indexOf(r[si]):0;if(g<0)continue;bins[b][g]++}
  const Wc=560,H=300,L=46,Bm=52,T=16,Rm=10;const tot=bins.map(b=>b.reduce((a,x)=>a+x,0));const mx=Math.max(1,...tot);const yt=niceTicks(0,mx,5);const ymax=Math.max(mx,yt[yt.length-1]);
  const pw=Wc-L-Rm,ph=H-T-Bm,bw=pw/bins.length;const Y=v=>T+ph-v/ymax*ph;
  let g=yt.map(v=>`<line class="gl" x1="${L}" x2="${Wc-Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('');
  bins.forEach((b,j)=>{let acc=0;const x=L+j*bw+(disc?bw*.16:1),w=disc?bw*.68:bw-2;b.forEach((v,k)=>{if(!v)return;const y1=Y(acc+v),y0=Y(acc);acc+=v;g+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${(y0-y1).toFixed(1)}" style="fill:${si>=0?colorOf(k):'var(--c0)'}"><title>${esc(labels[j])}${si>=0?' · '+esc(sv[k]):''}: ${v}</title></rect>`});
    if(disc)g+=`<text x="${(x+w/2).toFixed(1)}" y="${(Y(tot[j])-5).toFixed(1)}" text-anchor="middle" class="title">${tot[j]}</text>`;
    const step=Math.ceil(bins.length/10);if(disc||j%step===0)g+=`<text x="${(disc?x+w/2:L+j*bw).toFixed(1)}" y="${H-Bm+16}" text-anchor="${disc?'middle':'start'}">${esc(labels[j])}</text>`});
  g+=`<line class="axis" x1="${L}" x2="${Wc-Rm}" y1="${T+ph}" y2="${T+ph}"/><text x="${L+pw/2}" y="${H-10}" text-anchor="middle" class="title">${esc(c.name)}</text>`;
  const leg=si>=0?`<div style="font-size:12.5px;margin-top:4px">${sv.map((v,k)=>`<span class="sw" style="background:${colorOf(k)}"></span>${esc(d.cols[si].name)} = ${esc(v)}`).join(' &nbsp; ')}</div>`:'';
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${Wc} ${H}" style="width:100%;min-width:420px;height:auto">${g}</svg></div>${leg}`}
function groupsOf(d,vi,gi){const gv=gi>=0?d.cols[gi].values:[null];const ii=idCol(d);return gv.map((g,k)=>{const rows=d.rows.filter(r=>r[vi]!=null&&(gi<0||r[gi]===g));return{label:g,k,rows,vals:rows.map(r=>r[vi]),ids:rows.map((r,j)=>ii>=0?r[ii]:j+1)}}).filter(G=>G.vals.length)}
function boxChart(d,vi,gi,s){const G=groupsOf(d,vi,gi).reverse();if(!G.length)return '<div class="msg warn">값이 없어요.</div>';G.forEach(g=>g.st=numStats(g.vals));
  const all=G.flatMap(g=>g.vals);const mn=Math.min(...all),mx=Math.max(...all);const xt=niceTicks(mn,mx,7);const x0=Math.min(mn,xt[0]),x1=Math.max(mx,xt[xt.length-1]);
  const Wc=600,L=24,Rr=24,rowH=96,T=10,H=T+G.length*rowH+56;const X=v=>L+(v-x0)/((x1-x0)||1)*(Wc-L-Rr);let g='';
  G.forEach((gr,i)=>{const st=gr.st,yc=T+i*rowH+52;const col='var(--c0)';
    g+=`<line x1="${X(st.min)}" x2="${X(st.max)}" y1="${yc}" y2="${yc}" style="stroke:var(--sel);stroke-width:1.5;stroke-dasharray:2 3"/><circle cx="${X(st.min)}" cy="${yc}" r="2.5" style="fill:var(--sel)"/><circle cx="${X(st.max)}" cy="${yc}" r="2.5" style="fill:var(--sel)"/>`;
    g+=`<rect x="${X(st.q1)}" y="${yc-11}" width="${Math.max(1.5,X(st.q3)-X(st.q1))}" height="22" style="fill:${col};fill-opacity:.55;stroke:${col}"/>`;
    g+=`<line x1="${X(st.mean-st.sd)}" x2="${X(st.mean+st.sd)}" y1="${yc}" y2="${yc}" style="stroke:var(--ink);stroke-width:2.2;opacity:.75"/>`;
    g+=`<line x1="${X(st.median)}" x2="${X(st.median)}" y1="${yc-11}" y2="${yc+11}" style="stroke:#e6d233;stroke-width:2.6"/><line x1="${X(st.mean)}" x2="${X(st.mean)}" y1="${yc-14}" y2="${yc+14}" style="stroke:var(--ink);stroke-width:2"/>`;
    if(s.annotate){g+=`<text x="${X(st.mean)}" y="${yc-22}" text-anchor="middle" class="title">${gr.label!=null?esc(gr.label)+': ':''}${st.mean.toFixed(2)} ± ${st.sd.toFixed(1)}</text>`;
      const qs=[st.q1,st.median,st.q3];const xs=qs.map(X);if(xs[1]-xs[0]<18)xs[0]=xs[1]-18;if(xs[2]-xs[1]<18)xs[2]=xs[1]+18;qs.forEach((q,k)=>g+=`<text x="${xs[k]}" y="${yc+28}" text-anchor="middle">${fx(q)}</text>`)}});
  if(s.compare!=='none')G.forEach(gr=>{const v=s.compare==='means'?gr.st.mean:gr.st.median;g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T+8}" y2="${T+G.length*rowH+4}" style="stroke:var(--muted);stroke-width:1.2;opacity:.45"/>`});
  const ay=T+G.length*rowH+8;g+=`<line x1="${L}" x2="${Wc-Rr}" y1="${ay}" y2="${ay}" style="stroke:var(--muted);stroke-width:2"/>`+xt.map(v=>`<text x="${X(v)}" y="${ay+16}" text-anchor="middle">${fmt(v)}</text>`).join('');
  let test='';if(G.length===2){const[a,b]=G.map(g=>g.st);const va=a.sd**2/a.n,vb=b.sd**2/b.n;const t=Math.abs(a.mean-b.mean)/Math.sqrt(va+vb);const df=(va+vb)**2/(va*va/(a.n-1)+vb*vb/(b.n-1));test=`Student's t: ${t.toFixed(3)} (p=${tP(t,df).toFixed(3)}, N=${a.n+b.n})`}
  else if(G.length>2){const N=G.reduce((s_,g)=>s_+g.st.n,0),gm=G.reduce((s_,g)=>s_+g.st.mean*g.st.n,0)/N;const ssb=G.reduce((s_,g)=>s_+g.st.n*(g.st.mean-gm)**2,0),ssw=G.reduce((s_,g)=>s_+g.st.n*g.st.sd**2,0);const F=(ssb/(G.length-1))/(ssw/(N-G.length));test=`ANOVA: ${F.toFixed(3)} (N=${N})`}
  if(test)g+=`<text x="${Wc/2}" y="${ay+38}" text-anchor="middle" class="title">${test}</text>`;
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${Wc} ${H}" style="width:100%;min-width:440px;height:auto">${g}</svg></div>
    <div style="font-size:12px;color:var(--muted)">파란 상자: 1사분위수~3사분위수 · <span style="color:#c9b400;font-weight:700">노란 선</span>: 중앙값 · 검은 선: 평균(±표준편차) · 점선: 최솟값~최댓값${test?' · p가 0.05보다 작으면 두 그룹의 평균 차이가 의미 있다고 봐요':''}</div>`}
function outlierPanel(d,vi,gi){const v=d.cols[vi];const G=groupsOf(d,vi,gi);const isCaa=v.name==='caa';let all=[];
  const rows=G.map(gr=>{const st=numStats(gr.vals);const iqr=st.q3-st.q1,lo=st.q1-1.5*iqr,hi=st.q3+1.5*iqr;let ids;
    if(isCaa)ids=gr.ids.filter((id,j)=>gr.vals[j]<0||gr.vals[j]>3);else ids=gr.ids.filter((id,j)=>gr.vals[j]<lo||gr.vals[j]>hi);all=all.concat(ids);
    return `<tr><td>${gr.label!=null?esc(d.cols[gi].name)+' = '+esc(gr.label):'전체'}</td><td>${fx(st.q1)}</td><td>${fx(st.q3)}</td><td>${fx(iqr)}</td><td>${fx(iqr*1.5)}</td><td class="fence">${fx(lo)}</td><td class="fence">${fx(hi)}</td><td class="ids">${ids.length?ids.join(', '):'없음'}</td></tr>`}).join('');

    ${isCaa?'<div class="msg warn" style="margin-top:8px">caa는 박스 플롯 기준으로는 이상치가 잘 드러나지 않아요. 교재는 caa의 범위(0~3)를 벗어난 값을 이상치로 봅니다. 위 표의 id는 그 기준으로 찾은 것이에요.</div>':''}
    ${v.name==='age'?'<div style="font-size:12px;color:var(--muted);margin-top:6px">교재의 이상치 표에는 trtbps, chol, thalachh, oldpeak, caa 다섯 속성만 정리했어요. age는 삭제하지 않습니다.</div>':''}
    ${canDrop&&pending.length?`<div class="row" style="margin-top:8px"><button class="btn blue" data-act="dropids" data-ids="${pending.join(',')}">이 이상치 행(id ${pending.join(', ')})을 heart_train.csv에서 삭제</button></div>`:canDrop&&all.length?'<div style="font-size:12.5px;color:var(--ok);margin-top:6px">✓ 이 표의 이상치는 이미 파일에서 삭제했어요. (Reload 했는지 확인하세요)</div>':''}
    <div class="note"><b>교재 과정</b> 처음 291명 데이터로 trtbps, chol, thalachh, oldpeak, caa를 하나씩 확인해 이상치가 있는 id 22개를 찾고, heart_train.csv에서 그 행을 지운 뒤 Reload하면 269명이 남아요. 지운 다음에는 사분위수가 바뀌어 새 이상치가 보일 수 있지만 교재는 처음 찾은 22개만 지웁니다.</div>`}
function catBars(d,vi,gi){const c=d.cols[vi];const G=groupsOf(d,vi,gi);

function rocPoints(scores,pos){const n=scores.length;const idx=range(n).sort((a,b)=>scores[b]-scores[a]);const P=pos.filter(Boolean).length,Nn=n-P;const pts=[[0,0]];let tp=0,fp=0;
  for(let i=0;i<n;){const s0=scores[idx[i]];while(i<n&&scores[idx[i]]===s0){if(pos[idx[i]])tp++;else fp++;i++}pts.push([Nn?fp/Nn:0,P?tp/P:0])}return pts}
function rocChart(ev,t,s){const Wc=480,H=440,L=50,B=44,T=12,Rm=14,pw=Wc-L-Rm,ph=H-T-B;const X=v=>L+v*pw,Y=v=>T+ph-v*ph;const pos=ev.actual.map(a=>a===t);
  let g=[0,.2,.4,.6,.8,1].map(v=>`<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T+ph}"/><line class="gl" x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${X(v)}" y="${T+ph+16}" text-anchor="middle">${v}</text><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('');
  g+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" style="fill:none;stroke:var(--line)"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" style="stroke:var(--muted);stroke-dasharray:4 4"/>`;
  const leg=[];ev.models.forEach((m,i)=>{if(s.hidden.includes(m.name))return;const sc=m.probs.map(p=>p[t]);const pts=rocPoints(sc,pos);const a=auc(sc,pos);leg.push(`<span><span class="sw" style="background:${MCOL[i%5]}"></span>${esc(m.name)} <b style="font-family:var(--f-mono)">AUC ${a.toFixed(3)}</b></span>`);
    g+=`<polyline points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" style="fill:none;stroke:${MCOL[i%5]};stroke-width:2.2"/>`;
    if(s.thr){let tp=0,fp=0,P=0,Nn=0;sc.forEach((v,j)=>{if(pos[j]){P++;if(v>=.5)tp++}else{Nn++;if(v>=.5)fp++}});g+=`<circle cx="${X(fp/Nn)}" cy="${Y(tp/P)}" r="5" style="fill:var(--panel);stroke:${MCOL[i%5]};stroke-width:2.5"><title>${esc(m.name)} 임계값 0.5</title></circle>`}});
  g+=`<text x="${L+pw/2}" y="${H-8}" text-anchor="middle" class="title">FP Rate (1-Specificity, 위양성률)</text><text transform="translate(14 ${T+ph/2}) rotate(-90)" text-anchor="middle" class="title">TP Rate (Sensitivity, 재현율)</text>`;
  return `<svg class="chart" viewBox="0 0 ${Wc} ${H}" style="width:100%;max-width:520px;height:auto;display:block">${g}</svg><div class="legend-row" style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:4px">${leg.join('')}</div>`}

function addNode(type,x,y,extra={}){if(x==null){const k=S.nodes.length;let tx=110+(k%6)*175,ty=110+Math.floor(k/6)%4*150;let guard=0;while(S.nodes.some(n=>Math.hypot(n.x-tx,n.y-ty)<80)&&guard++<30){tx+=40;ty+=30;if(tx>1120)tx=110;if(ty>640)ty=110}x=tx;y=ty}
  const n={id:S.next++,type,x:Math.max(50,Math.min(1150,x)),y:Math.max(45,Math.min(660,y)),name:extra.name||uniqName(type),settings:Object.assign(W[type].defaults(),extra.settings||{}),opened:false};

  if(!W[a.type].outs.length){toast(`${a.name} 위젯은 내보내는 출력이 없어요.`);return}
  if(!pairs.length){toast(`${a.name}의 출력(${W[a.type].outs.map(o=>o.n).join(', ')})을 ${b.name}이(가) 받을 수 없어요.`);return}
  if(wouldCycle(from,to)){toast('순환 연결은 만들 수 없어요.');return}

  else{drag.x=pt.x;drag.y=pt.y;renderCanvas()}});
svg.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;const pt=svgPt(e);
  if(d.kind==='move'){if(!d.moved){const t=Date.now();if(lastTap.kind==='node'&&lastTap.id===d.id&&t-lastTap.t<450){openDialog(d.id);lastTap={id:null,t:0}}else lastTap={id:d.id,t,kind:'node'}}else save()}
  else{const tgt=S.nodes.filter(n=>n.id!==d.from).map(n=>[Math.hypot(n.x-pt.x,n.y-pt.y),n]).sort((a,b)=>a[0]-b[0])[0];if(tgt&&tgt[0]<48)heavy(()=>tryConnect(d.from,tgt[1].id));else if(Math.hypot(pt.x-node(d.from).x-arcR,pt.y-node(d.from).y)>20)toast('연결할 위젯 위에 놓아 주세요.')}
  renderCanvas()});

const TYPES4={cp:'C',restecg:'C',slp:'C',thall:'C'},ROLES2={id:'meta',output:'target'};
function loadSolution(){S={nodes:[],links:[],next:1,disk:{del:[...OUT22],ver:1}};DISK=S.disk;
  const f=addNode('file',80,330,{settings:{file:'heart_train.csv',types:{...TYPES4},roles:{...ROLES2},ver:1,del:[...OUT22]}}),dt=addNode('table',230,110),bp=addNode('boxplot',230,560,{settings:{variable:'chol',group:'output'}}),
    nn=addNode('nn',450,170),lr=addNode('lr',450,330),nb=addNode('nb',450,490),ts=addNode('testscore',700,250,{settings:{target:'1'}}),roc=addNode('roc',900,130),cm=addNode('confusion',900,330),
    f1=addNode('file',560,640,{name:'File (1)',settings:{file:'heart_test.csv',types:{...TYPES4},roles:{...ROLES2}}}),pr=addNode('predictions',900,560);
  const L=(a,b,o,i)=>S.links.push({id:S.next++,from:a.id,to:b.id,out:o,in:i});
  L(f,dt,'Data','Data');L(f,bp,'Data','Data');L(f,nn,'Data','Data');L(f,lr,'Data','Data');L(f,nb,'Data','Data');L(f,ts,'Data','Data');L(nn,ts,'Learner','Learner');L(lr,ts,'Learner','Learner');L(nb,ts,'Learner','Learner');
  L(ts,roc,'Evaluation Results','Evaluation Results');L(ts,cm,'Evaluation Results','Evaluation Results');L(lr,pr,'Model','Predictors');L(nb,pr,'Model','Predictors');L(f1,pr,'Data','Data');sel=null;changed()}

const srcsOf=(n,inp)=>S.links.filter(l=>l.to===n.id&&l.in===inp).map(l=>({n:node(l.from),out:l.out}));
const of=t=>S.nodes.filter(n=>n.type===t);
const fileOf=n=>{const s=srcsOf(n,'Data')[0];return s&&s.n.type==='file'?s.n:null};
const isFile=(n,f)=>n&&n.type==='file'&&n.settings.file===f;
const typesOk=f=>{const d=R[f.id]&&R[f.id].data;if(!d)return false;const c=nm=>d.cols.find(x=>x.name===nm);return['cp','restecg','slp','thall'].every(k=>c(k)&&c(k).type==='C')&&c('output')&&c('output').role==='target'&&c('id')&&c('id').role==='meta'};
const cleanOk=f=>isFile(f,'heart_train.csv')&&f.settings.del.length===22&&OUT22.every(id=>f.settings.del.includes(id));
/* Box Plot 미션은 한 번 확인하면 다른 변수로 바꿔도 체크가 유지되도록 기록해 둔다 */
const bpSeen=v=>of('boxplot').some(n=>{if(!fileOf(n))return false;if(n.opened&&n.settings.variable===v&&n.settings.group==='output')(n.seen||(n.seen={}))[v]=true;return!!(n.seen&&n.seen[v])});
const goodTrain=f=>f&&cleanOk(f)&&typesOk(f);
const modelsOf=(n,inp)=>srcsOf(n,inp).map(s=>s.n);
const goodModel=m=>m&&['nb','lr','nn'].includes(m.type)&&goodTrain(fileOf(m));
const goodTS=t=>{const ls=modelsOf(t,'Learner');return goodTrain(fileOf(t))&&['nb','lr','nn'].every(k=>ls.some(m=>m.type===k&&goodModel(m)))};

let NB=null;
function nbInit(){const names=['id',...HC];const rows=[];HEART.forEach((r,i)=>{const id=i+1;if(id>=160&&id<=171||OUT22.includes(id))return;rows.push([id,...r])});
  const cols=names.map(nm=>{const isC=['sex','cp','fbs','restecg','exng','slp','thall','output'].includes(nm);const c={name:nm,type:isC?'C':'N',role:nm==='id'?'meta':nm==='output'?'target':'feature'};if(isC)c.values=[...new Set(rows.map(r=>r[names.indexOf(nm)]))].sort((a,b)=>a-b).map(String);return c});
  const d={cols,rows:rows.map(r=>r.map((v,j)=>cols[j].type==='C'?String(v):v))};const M=fitNB(d,{});
  NB={M,n:d.rows.length,use:Object.fromEntries(M.tables.map(t=>[t.name,true])),val:{},pid:null,bp:{pH:.3,pEH:.8,pEnH:.1}};nbPatient(160)}
function nbPatient(id){NB.pid=id;const r=HEART[id-1];NB.M.tables.forEach(t=>{const v=r[HC.indexOf(t.name)];NB.val[t.name]=t.binOf(t.type==='C'?String(v):v)})}
function renderLab(){if(!NB)nbInit();const M=NB.M,K=2,prior=M.prior;const lab=v=>v;
  $('#nb-card').innerHTML=`<h2>환자 카드</h2><p style="margin:0 0 6px;font-size:12.5px;color:var(--muted)">테스트 환자를 불러오거나 값을 직접 바꿔 보세요. 체크를 끄면 그 정보는 계산에서 빠져요.</p>
    <div style="font-size:12px;color:var(--muted);font-weight:600">테스트 데이터 환자 (heart_test.csv)</div><div class="presets">${TEST_IDS.map(id=>`<button class="${NB.pid===id?'on':''}" data-nbp="${id}">id ${id}</button>`).join('')}</div>
    ${M.tables.map(t=>`<div class="nb-f"><input type="checkbox" data-nbu="${t.name}" ${NB.use[t.name]?'checked':''} aria-label="${t.name} 사용"><div class="nm">${FKO[t.name]}<small>${t.name}</small></div>
      <select data-nbv="${t.name}">${t.labels.map((l,b)=>`<option value="${b}" ${NB.val[t.name]===b?'selected':''}>${esc(t.type==='C'&&VKO[t.name]?l+' · '+VKO[t.name][l]:l)}</option>`).join('')}</select></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn" data-nball="1">모두 사용</button><button class="btn" data-nball="0">모두 끄기</button></div>`;
  let lp=[Math.log((prior[0]+1)/(NB.n+K)),Math.log((prior[1]+1)/(NB.n+K))];const post=()=>{const m=Math.max(...lp);const e=lp.map(x=>Math.exp(x-m));return e[1]/(e[0]+e[1])};
  const steps=[`<div class="step"><div><b>사전 확률</b><br><span style="font-size:11.5px;color:var(--muted)">정보를 보기 전 (훈련 데이터 ${NB.n}명)</span></div><div class="lk">0: ${prior[0]}명<br>1: ${prior[1]}명</div><div class="pbar"><i style="width:${(post()*100).toFixed(1)}%"></i><b></b></div><div class="pv">${(post()*100).toFixed(1)}%</div></div>`];
  M.tables.forEach(t=>{if(!NB.use[t.name])return;const b=NB.val[t.name];const p1=(t.cnt[b][1]+1)/(prior[1]+t.labels.length),p0=(t.cnt[b][0]+1)/(prior[0]+t.labels.length);lp[0]+=Math.log(p0);lp[1]+=Math.log(p1);const pv=post();const lab_=t.labels[b];
    steps.push(`<div class="step"><div><b>${FKO[t.name]}</b> = ${esc(t.type==='C'&&VKO[t.name]?VKO[t.name][lab_]:lab_)}<br><span style="font-size:11.5px;color:var(--muted)">${p1>p0?'▲ 위험 쪽 증거':'▼ 안전 쪽 증거'} (×${(p1/p0).toFixed(2)})</span></div><div class="lk">P(x|1)=${p1.toFixed(3)}<br>P(x|0)=${p0.toFixed(3)}</div><div class="pbar"><i style="width:${(pv*100).toFixed(1)}%"></i><b></b></div><div class="pv">${(pv*100).toFixed(1)}%</div></div>`)});
  const pf=post();const truth=NB.pid&&M.tables.every(t=>{const r=HEART[NB.pid-1];const v=r[HC.indexOf(t.name)];return t.binOf(t.type==='C'?String(v):v)===NB.val[t.name]})?ORIG(NB.pid):null;const pred=pf>=.5?1:0;const bp=NB.bp;const pE=bp.pEH*bp.pH+bp.pEnH*(1-bp.pH);
  $('#nb-steps').innerHTML=`<h2>나이브 베이즈는 이렇게 계산해요</h2><p style="margin:0 0 8px;font-size:12.5px;color:var(--muted)">사전 확률에서 출발해 속성 하나하나의 가능도 P(x|클래스)를 곱해 가며 output이 1일 확률(사후 확률)을 고칩니다. 막대의 빨간 부분이 "심장 마비 가능성 높음(1)"의 확률이에요.</p>
    <div class="verdict"><div><div style="font-size:12px;color:var(--muted)">최종 예측</div><div class="big" style="color:${colorOf(pred)}">output ${pred} · ${VKO.output[pred]}</div></div><div style="font-family:var(--f-mono);font-size:13px">P(1 | 정보) = ${(pf*100).toFixed(1)}%</div>
      ${truth!=null?`<div style="font-size:13px">원본 정답: <b>${truth}</b> ${truth===pred?'<span style="color:var(--ok)">✓ 맞혔어요</span>':'<span style="color:var(--err)">✗ 틀렸어요</span>'}</div>`:'<div style="font-size:12.5px;color:var(--muted)">값을 바꿨기 때문에 정답이 없는 가상의 환자예요.</div>'}</div>
    <div>${steps.join('')}</div>
    <div class="formula">P(1 | x₁, x₂, …) ∝ P(1) × P(x₁|1) × P(x₂|1) × …<br>P(0 | x₁, x₂, …) ∝ P(0) × P(x₁|0) × P(x₂|0) × …<br><span style="color:var(--muted)">두 값을 합이 1이 되도록 나누면 확률이 돼요. 속성들이 서로 독립이라고 가정하고 그냥 곱하기 때문에 "나이브(naive, 순진한)"라는 이름이 붙었어요. 개수가 0이 되지 않도록 모든 칸에 1을 더해서 셉니다(라플라스 스무딩). 수치형 속성은 4개 구간으로 나눴어요.</span></div>
    <h2 style="margin-top:16px">베이즈 정리 계산기</h2><p style="margin:0;font-size:12.5px;color:var(--muted)">H = 심장 마비 가능성 높음, E = 어떤 검사 결과(예: 운동 유발 협심증 있음)라고 생각해 보세요.</p>
    <div class="bayes"><div><label for="bp1">사전 확률 P(H): <b>${bp.pH.toFixed(2)}</b></label><input id="bp1" type="range" min="0.01" max="0.99" step="0.01" value="${bp.pH}" data-bp="pH"></div>
      <div><label for="bp2">가능도 P(E|H): <b>${bp.pEH.toFixed(2)}</b></label><input id="bp2" type="range" min="0.01" max="0.99" step="0.01" value="${bp.pEH}" data-bp="pEH"></div>
      <div><label for="bp3">P(E|H가 아님): <b>${bp.pEnH.toFixed(2)}</b></label><input id="bp3" type="range" min="0.01" max="0.99" step="0.01" value="${bp.pEnH}" data-bp="pEnH"></div></div>
    <div class="formula">P(H|E) = P(E|H)·P(H) / P(E) = ${bp.pEH.toFixed(2)} × ${bp.pH.toFixed(2)} / ${pE.toFixed(3)} = <b>${(bp.pEH*bp.pH/pE).toFixed(3)}</b><br><span style="color:var(--muted)">P(E) = P(E|H)·P(H) + P(E|H가 아님)·(1 − P(H)) = ${pE.toFixed(3)}</span></div>`}
document.addEventListener('click',e=>{if($('#tab-lab').hidden)return;const p=e.target.closest('[data-nbp]');if(p){nbPatient(+p.dataset.nbp);renderLab();return}
  const a=e.target.closest('[data-nball]');if(a){Object.keys(NB.use).forEach(k=>NB.use[k]=a.dataset.nball==='1');renderLab()}});
document.addEventListener('change',e=>{if($('#tab-lab').hidden)return;const el=e.target;if(el.dataset.nbu){NB.use[el.dataset.nbu]=el.checked;renderLab()}if(el.dataset.nbv){NB.val[el.dataset.nbv]=+el.value;renderLab()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bp&&NB){NB.bp[el.dataset.bp]=+el.value;renderLab();const again=document.querySelector(`[data-bp="${el.dataset.bp}"]`);if(again)again.focus()}});

/* ---------- quiz ---------- */
const QUIZ=[
 ['이 활동에서 다루는 데이터의 종류는?',['이미지 데이터','정형 데이터','소리 데이터','텍스트 데이터'],1,'행(환자)과 열(속성)로 이루어진 표 형태의 정형 데이터예요.'],
 ['File 위젯에서 id 속성의 역할(Role)을 무엇으로 바꿨나요?',['feature','target','meta','skip'],2,'id는 학습과 예측에서 빼고 데이터 확인용으로만 쓰므로 meta로 바꿔요.'],
 ['cp(가슴 통증 유형: 0~3)를 categorical로 바꾸는 이유는?',['값이 소수라서','숫자가 크기가 아니라 종류를 나타내서','결측치가 있어서','타깃이라서'],1,'0~3은 "무증상, 전형적 협심증…" 같은 종류를 뜻하므로 범주형이에요.'],
 ['output의 역할은?',['feature','target','meta','skip'],1,'심장 마비 가능성(output)이 예측할 속성, 즉 target(종속 변수)이에요.'],
 ['박스 플롯에서 상자의 왼쪽 끝과 오른쪽 끝은?',['최솟값과 최댓값','1사분위수와 3사분위수','평균과 표준편차','중앙값과 평균'],1,'상자는 1사분위수(Q1)부터 3사분위수(Q3)까지예요. 그 길이가 사분위수 범위(IQR)입니다.'],
 ['output이 1인 그룹의 chol에서 Q1 = 209, Q3 = 268일 때, 위쪽 안울타리는?',['268','297.5','356.5','384'],2,'IQR = 59, 1.5×IQR = 88.5 → 268 + 88.5 = 356.5보다 크면 이상치예요.'],
 ['교재에서 이상치를 지운 뒤 훈련 데이터는 몇 명이 되었나요?',['291명','281명','269명','303명'],2,'이상치가 있는 id 22개를 지워 291 − 22 = 269명이 됐어요.'],
 ['caa(착색된 주요 혈관 수)의 이상치는 어떻게 판단했나요?',['박스 플롯의 안울타리 밖','값의 범위 0~3을 벗어난 값','평균보다 큰 값','결측치'],1,'caa는 박스 플롯으로는 이상치가 잘 드러나지 않아, 정해진 범위(0~3)가 아닌 값(4)을 이상치로 봤어요.'],
 ['Test and Score의 교차 검증에서 폴드 수가 5이면?',['데이터를 5번 복사한다','데이터를 5등분해 1/5로 검증하는 과정을 5번 반복한다','5명만 검증한다','5개 모델을 만든다'],1,'5등분 → 1/5 검증, 4/5 학습을 각 등분마다 돌아가며 5번 하고 평균을 내요.'],
 ['ROC 커브에서 AUC가 클수록?',['모델 성능이 나쁘다','모델 성능이 우수하다','데이터가 많다','학습 시간이 길다'],1,'AUC(곡선 아래 넓이)가 1에 가까울수록 우수한 모델이에요.'],
 ['교재에서 심장 마비가 없는 환자를 발생할 것으로 잘못 예측한 경우(0→1)가 가장 적었던 모델은?',['Logistic Regression','Neural Network','Naive Bayes','모두 같음'],2,'0→1 오류: LR 24건, NN 28건, NB 23건. 이 관점에서 Naive Bayes를 선택했어요.'],
 ['베이즈 정리 P(H|E) = P(E|H)P(H) / P(E)에서 P(H)는?',['사후 확률','사전 확률','가능도','증거'],1,'P(H)는 정보를 보기 전의 믿음인 사전 확률, P(H|E)는 정보 E를 반영한 사후 확률이에요.']
];
const QA=new Array(QUIZ.length).fill(null);
function renderQuiz(){const sc=QA.filter((a,i)=>a===QUIZ[i][2]).length,an=QA.filter(a=>a!=null).length;
  $('#quiz').innerHTML=`<div class="qhead"><div><h2>확인 퀴즈</h2><div style="color:var(--muted);font-size:13px">3장 "내 심장은 건강할까?"를 정리하는 ${QUIZ.length}문제</div></div><div style="display:flex;gap:8px;align-items:center"><span class="score">${sc} / ${QUIZ.length}점 · ${an}문제 풂</span><button class="tbtn" id="qreset">다시 풀기</button></div></div>
  ${QUIZ.map(([q,o,a,ex],i)=>`<div class="q"><div class="qn">Q${i+1}</div><h4>${q}</h4><div class="opts">${o.map((t,j)=>{const done=QA[i]!=null;const cls=done?(j===a?'right':j===QA[i]?'wrong':''):'';return `<button data-q="${i}" data-o="${j}" class="${cls}" ${done?'disabled':''}>${'ABCD'[j]}. ${t}</button>`}).join('')}</div>${QA[i]!=null?`<div class="exp"><b>${QA[i]===a?'정답!':'아쉬워요.'}</b> ${ex}</div>`:''}</div>`).join('')}`;
  $('#qreset').onclick=()=>{QA.fill(null);renderQuiz()};
  $('#quiz').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{QA[+b.dataset.q]=+b.dataset.o;renderQuiz()})}

function showTab(t){if(!TABS.includes(t))t='practice';TABS.forEach(x=>{$('#tab-'+x).hidden=x!==t;$('#t-'+x).setAttribute('aria-selected',x===t)});
  try{history.replaceState(null,'','#'+t)}catch(_){}if(t==='lab')renderLab()}
